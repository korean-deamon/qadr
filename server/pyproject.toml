[project]
name = "qadr-server"
version = "0.1.0"
description = "Qadr API: neighbourhood borrowing and item sharing (FastAPI modular monolith)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "email-validator==2.3.0",
    "sqlalchemy[asyncio]==2.1.4",
    "asyncpg==0.32.0",
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "pyjwt==2.15.1",
    "redis==8.1.0",
    "celery==5.6.3",
    "httpx==0.28.1",
    "aiogram==3.31.0",
    "structlog==26.1.0",
    "python-multipart==0.0.32",
    "pillow==12.3.0",
    "google-auth>=2.61.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.0",
    "mypy==2.4.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]
ignore = ["S101", "B008", "RUF001", "RUF002", "RUF003", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "E501", "RUF059", "ASYNC240", "E402"]
"app/core/i18n.py" = ["E501"]
"app/main.py" = ["ASYNC240"]
"app/seed.py" = ["E501", "S105"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
