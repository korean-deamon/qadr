# Qadr — production stack.
#
#   cp .env.example .env.production   # fill in real values (see README)
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# The `proxy` service (Caddy, automatic HTTPS) publishes 80/443 by default. If
# something else on the box already owns those ports (another reverse proxy,
# e.g. nginx/aaPanel), skip `proxy` when starting the stack and point that
# existing proxy at api/bot/frontend's 127.0.0.1 ports instead (API_HOST_PORT/
# BOT_HOST_PORT/WEB_HOST_PORT below, same routing the Caddyfile defines:
# /api/* -> api, /tg/* -> bot, else -> frontend). Postgres, Redis and the
# worker/beat are never exposed either way. Secrets come from the env file at
# runtime and are never baked into images.
#
# `IMAGE_PREFIX` can be a registry path (e.g. ghcr.io/you/qadr) instead of the local
# default "qadr" — set that and `docker compose pull && up -d` uses pre-built images
# from CI instead of building on the box (see README → "Deploying").
#
# Resource floor this is tuned for: 2 vCPU / 4 GB RAM. `deploy.resources.limits.cpus`
# is a per-container burst ceiling, not a reservation — the figures below sum to well
# above 2 vCPU on purpose (idle containers don't use their ceiling; this just stops
# any single one, e.g. a stuck Celery task, from starving the others). Memory limits
# are real ceilings and sum to ~2.8 GB, leaving headroom for the OS and Postgres's own
# buffers. On a bigger box, raise `CELERY_CONCURRENCY` and the limits below.
name: qadr-prod

x-server-env: &server-env
  APP_ENV: production
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  TRUSTED_PROXY_HOPS: "1"
  RATE_LIMIT_MULTIPLIER: "1"
  MEDIA_ROOT: /app/media

x-server: &server
  image: ${IMAGE_PREFIX:-qadr}-server:${IMAGE_TAG:-latest}
  build: { context: ./server, target: api }
  env_file: ${ENV_FILE:-.env.production}
  environment: *server-env
  restart: unless-stopped
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }
  logging: &logging
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768M }
        reservations: { memory: 256M }

  redis:
    image: redis:7.4-alpine
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }
        reservations: { memory: 64M }

  # One-off: apply migrations before anything else starts. Set SEED_DEMO=true
  # to load demo data (idempotent) — for staging, not for a real launch.
  migrate:
    image: ${IMAGE_PREFIX:-qadr}-server:${IMAGE_TAG:-latest}
    build: { context: ./server, target: api }
    env_file: ${ENV_FILE:-.env.production}
    environment: *server-env
    command: ["sh", "-c", "alembic upgrade head && if [ \"$${SEED_DEMO:-false}\" = true ]; then python -m app.seed; fi"]
    volumes: [media:/app/media]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: "no"
    logging: *logging
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  api:
    <<: *server
    volumes: [media:/app/media]
    # Bound to 127.0.0.1 only — reachable from the host's own reverse proxy,
    # never directly from the internet. Override the host port with
    # API_HOST_PORT if 8000 is already taken by something else on the box.
    ports: ["127.0.0.1:${API_HOST_PORT:-8000}:8000"]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
        reservations: { memory: 256M }

  worker:
    <<: *server
    # 2 fits a 2 vCPU floor; raise CELERY_CONCURRENCY in .env.production on a bigger box.
    command: ["sh", "-c", "exec celery -A app.tasks.celery_app worker --loglevel=INFO --concurrency=${CELERY_CONCURRENCY:-2}"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      start_period: 20s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
        reservations: { memory: 192M }

  beat:
    <<: *server
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=INFO", "-s", "/tmp/celerybeat-schedule"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time,glob; f=glob.glob('/tmp/celerybeat-schedule*'); sys.exit(0 if f and time.time()-max(map(os.path.getmtime,f))<400 else 1)"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }

  bot:
    <<: *server
    image: ${IMAGE_PREFIX:-qadr}-bot:${IMAGE_TAG:-latest}
    build: { context: ./server, target: bot }
    # /tg/webhook (Telegram) and /tg/health. Same 127.0.0.1-only note as api.
    ports: ["127.0.0.1:${BOT_HOST_PORT:-8082}:8081"]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 160M }

  frontend:
    image: ${IMAGE_PREFIX:-qadr}-web:${IMAGE_TAG:-latest}
    build:
      context: ./client
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        API_INTERNAL_URL: http://api:8000
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    logging: *logging
    # Same 127.0.0.1-only note as api.
    ports: ["127.0.0.1:${WEB_HOST_PORT:-3000}:3000"]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 384M }
        reservations: { memory: 192M }

  proxy:
    image: caddy:2.10-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend: { condition: service_healthy }
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }

volumes:
  pgdata:
  redisdata:
  media:
  caddy_data:
  caddy_config:
